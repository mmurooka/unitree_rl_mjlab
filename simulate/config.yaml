robot: "g1"
#robot_scene: "src/assets/robots/unitree_g1/xmls/scene_g1.xml"
robot_scene: "src/assets/robots/unitree_g1/xmls/scene_g1_table_box.xml"
#robot_scene: "src/assets/robots/unitree_g1/xmls/scene_g1_29dof_with_hand.xml"
#robot: "g1_23dof"
#robot_scene: "src/assets/robots/unitree_g1/xmls/scene_g1_23dof.xml"
#robot: "h1_2"
#robot_scene: "src/assets/robots/unitree_h1_2/xmls/scene_h1_2.xml"
#robot: "go2"
#robot_scene: "src/assets/robots/unitree_go2/xmls/scene_go2.xml"
#robot: "a2"
#robot_scene: "src/assets/robots/unitree_a2/xmls/scene_a2.xml"

domain_id: 0  # Domain id
interface: "lo" # Interface

use_joystick: 1 # Simulate Unitree WirelessController using a gamepad
joystick_type: "xbox" # support "xbox" and "switch" gamepad layout
joystick_device: "/dev/input/js0" # Device path
joystick_bits: 16 # Some game controllers may only have 8-bit accuracy

print_scene_information: 1 # Print link, joint and sensors information of robot

enable_elastic_band: 1 # Virtual spring band, used for lifting h1

# Livox MID-360 compatible ROS 2 output
mid360:
  enabled: true
  scan_pattern: "assets/livox/mid360.csv"
  frame_id: "livox_frame"
  lidar_topic: "/livox/lidar"
  imu_topic: "/livox/imu"
  point_rate: 200000
  publish_frequency: 10
  imu_frequency: 200
  # Sensor delay in simulation seconds, independent of the localization source.
  # Start external GLIM after the robot is stable; a fixed delay is not readiness.
  startup_delay: 0.0
  min_range: 0.1
  max_range: 40.0
  downsample: 2

# Intel RealSense D435 compatible ROS 2 output
d435:
  enabled: true
  width: 960
  height: 540
  frequency: 30
  min_range: 0.1
  max_range: 10.0
  publish_pointcloud: true
  pointcloud_downsample: 2
  topic_root: "/camera/camera"

# Object truth is published only for evaluation. Never use it for recognition,
# goal generation, or marker search (including in GLIM-free mode).
frame_pose_list:
  enabled: true
  source: "aruco"
  topic: "/frame_pose_list"
  ground_truth_topic: "/evaluation/frame_pose_list"
  reference_site: "imu"
  reference_frame: "root_yaw"
  publish_frequency: 20

  aruco:
    image_topic: "/camera/camera/color/image_raw"
    camera_info_topic: "/camera/camera/color/camera_info"
    # Use the color optical frame in Image/CameraInfo. Model FK supplies the
    # camera pose from measured waist angles and body IMU, in both sim and real.
    camera_frame: ""
    dictionary: "DICT_4X4_50"
    # Show the robot camera with detected marker borders, IDs and pose axes.
    # Press q while the window is focused to close only the display.
    display: true
    display_window: "Robot camera / ArUco"
    markers:
      0:
        frame_name: "carry_box"
        marker_size: 0.12
        # Pose of the marker coordinate frame in the object's frame.
        object_to_marker:
          translation: [-0.1305, 0.0, 0.0]
          rotation_xyzw: [0.5, -0.5, -0.5, 0.5]
      1:
        frame_name: "pickup_table"
        marker_size: 0.12
        object_to_marker:
          translation: [0.0, 0.0, 0.5605]
          rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
      2:
        frame_name: "place_table"
        marker_size: 0.12
        object_to_marker:
          translation: [0.0, 0.0, 0.5605]
          rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
